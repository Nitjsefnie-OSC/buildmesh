name: CI for target ref

# Generic exact-ref CI wrapper. Dispatched manually with any branch, tag, or
# commit SHA; it resolves the input to the exact 40-character commit under
# test, prints that SHA as a literal searchable provenance line in ordinary
# job logs, and runs the repository's established frontend CI surface
# (typecheck, mobile bundle build, full unit suite) against that exact
# checkout. Unqualified names that exist as both a branch and a tag resolve
# branch-first (actions/checkout precedence); use fully qualified
# refs/heads/<name> or refs/tags/<name> to disambiguate such collisions.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to check out and test; fully qualified refs (refs/heads/... or refs/tags/...) disambiguate branch/tag name collisions"
        required: true
        type: string

permissions:
  contents: read

# Verification runs must never cancel one another. GitHub concurrency groups
# are case-insensitive, so keying on the raw ref spelling could cancel a
# distinct ref differing only by case; equivalent spellings of one target do
# not coalesce either. Every dispatch gets a unique, non-cancelling group.
concurrency:
  group: target-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  target-ci:
    name: Target CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      # Provenance: resolve whatever ref syntax was supplied to the exact
      # commit under test and print it as a literal, greppable log line. The
      # untrusted input reaches the shell only through an environment
      # variable, never through direct interpolation.
      - name: Resolve exact target SHA and print provenance
        id: target
        shell: bash
        env:
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          RESOLVED="$(git rev-parse HEAD)"
          test "${#RESOLVED}" -eq 40
          echo "resolved_sha=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "CI-TARGET-SHA: $RESOLVED"
          echo "CI-TARGET-REF-INPUT: $TARGET_REF_INPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts: dependency lifecycle scripts come from the checked-
      # out candidate and must never execute inside this verification wrapper.
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Exact-tree gate 1: dependency installation must not move HEAD or
      # dirty the tracked worktree (staged or unstaged). The expected SHA is
      # bound through a trusted environment value from the provenance step.
      - name: Verify exact tree after dependency install
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(git rev-parse HEAD)"
          test "$HEAD_NOW" = "$EXPECTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          echo "TREE-INTACT-AFTER-INSTALL: $HEAD_NOW"

      # Direct typecheck; --no-install keeps npx from substituting anything
      # beyond the installed dependency tree.
      - name: Typecheck frontend
        run: npx --no-install tsc --noEmit

      # Established mobile bundle build, invoked as the concrete underlying
      # command of the repository's package.json "build:mobile" entry so the
      # candidate's scripts block cannot redefine or skip it.
      - name: Build mobile bundle
        run: npx --no-install vite build --mode mobile

      # Full unit suite, invoked as the concrete underlying command of the
      # repository's package.json "test:unit" entry for the same reason: no
      # candidate-redefinable script and no test-path narrowing.
      - name: Unit tests
        run: npx --no-install vitest run tests/unit

      # Exact-tree gate 2: validation steps must not have moved HEAD or
      # dirtied the tracked worktree (staged or unstaged).
      - name: Verify exact tree after validation
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(git rev-parse HEAD)"
          test "$HEAD_NOW" = "$EXPECTED_SHA"
          git diff --quiet
          git diff --cached --quiet
          echo "TREE-INTACT-AFTER-VALIDATION: $HEAD_NOW"
